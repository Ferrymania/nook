# Nook 新安装模板：自动启动 Nook + PostgreSQL 18。
# 已有独立 PostgreSQL 时，请使用 docker-compose.external-postgres.yml。
# 已用 PostgreSQL 16/17 的部署请继续使用原 Compose；迁移数据库至 18 后再切换。
#
# 新手建议：
#   1. 不用 .env。
#   2. 直接改本文件。
#   3. 第一次可以不改路径；media 目录不存在时会自动创建。
#
# 启动：
#   docker compose up -d
#
# 访问：
#   http://服务器IP:18080
#
# 默认账号：
#   admin / admin123

services:
  nook:
    image: ${NOOK_IMAGE:-ghcr.io/ferrymania/nook:latest}

    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy

    # 浏览器访问端口。
    # 如果 18080 被占用，可以改成 "19011:18080" 之类，容器内仍使用 18080。
    ports:
      - "18080:18080"

    volumes:
      # 程序运行数据：JWT 密钥和运行配置。
      # 主数据库在 ./postgres，升级/备份时 ./data 和 ./postgres 都要保留。
      - ./data:/data

      # 缓存目录：海报缓存、临时文件等。通常不用备份。
      - ./cache:/cache

      # 媒体库目录。
      # 文件操作和重命名需要保持读写，不能加 :ro。
      # 只有完全不整理、只扫描/播放已有媒体时，才建议手动改成只读。
      # 默认使用当前目录的 ./media；目录不存在时会自动创建。
      # NAS 用户把左边改成真实路径，例如：
      #   - /vol1/1000/Media:/media
      # Windows Docker Desktop 示例：
      #   - "D:/Media:/media"
      - ./media:/media

    environment:
      TZ: Asia/Shanghai

      # Linux/NAS 用户权限。一般 1000 就可以。
      # 如果写入文件权限不对，再改成宿主机实际用户的 uid/gid。
      PUID: "1000"
      PGID: "1000"

      # 轻量模式默认只使用 PostgreSQL，适合大多数 NAS。
      NOOK_DATABASE_TYPE: postgres
      NOOK_DATABASE_DSN: postgres://nook:nook@postgres:5432/nook?sslmode=disable

      # 媒体库使用容器路径；更换媒体库目录请在网页管理。

      # 播放模式、转码与硬件加速统一在网页「系统设置 → 常规」中管理。

    healthcheck:
      # 不能写死 http://：开启 HTTPS 后 18080 只接受 TLS，固定明文探测会
      # 每轮刷一条 TLS handshake error 并让容器一直 unhealthy。
      test: ["CMD", "/usr/local/bin/nook-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    # 限制 Docker 日志大小，避免长期运行把磁盘写满。
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  postgres:
    image: postgres:18-alpine
    # 首次部署允许拉取；日常更新请只 pull nook。
    # 跨大版本升级 PostgreSQL 时，请先备份并迁移数据库。
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: nook
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: nook
      TZ: Asia/Shanghai
    volumes:
      # PostgreSQL 18 在此挂载下使用 18/docker 保存数据。
      - ./postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nook -d nook"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
