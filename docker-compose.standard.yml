# Nook 第二档完整 Docker Compose 部署文件
#
# 组件：
#   Nook + PostgreSQL + Redis
#
# 使用方式二选一：
#   1. 保存为 docker-compose.yml 后执行：
#        docker compose up -d
#   2. 保留本文件名时执行：
#        docker compose -f docker-compose.standard.yml up -d
#
# 适合：
#   多用户、第三方 Emby 客户端频繁刷新、媒体列表/首页访问较多的 NAS。
#
# 默认账号：
#   admin / admin123

services:
  nook:
    image: ${NOOK_IMAGE:-ghcr.io/ferrymania/nook:latest}

    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "18080:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # 程序运行数据：JWT 密钥和运行配置。
      - ./data:/data

      # 缓存目录：海报缓存、临时文件等。通常不用备份。
      - ./cache:/cache

      # 媒体库目录。自动整理/重命名/入库需要读写权限。
      # 目录不存在时会自动创建。
      # NAS 示例：- /vol1/1000/Media:/media
      # Windows Docker Desktop 示例：- "D:/Media:/media"
      - ./media:/media

    environment:
      TZ: Asia/Shanghai

      PUID: "0"
      PGID: "0"

      NOOK_DATABASE_TYPE: postgres
      NOOK_DATABASE_DSN: postgres://nook:nook@postgres:5432/nook?sslmode=disable

      # Redis 只做热缓存，源数据仍在 PostgreSQL；Redis 丢失可自动重建。
      NOOK_CACHE_REDIS_URL: redis://redis:6379/0
      NOOK_CACHE_CACHE_DIR: /cache

      NOOK_UPDATE_IMAGE: ${NOOK_IMAGE:-ghcr.io/ferrymania/nook:latest}


      # 播放模式、转码与硬件加速统一在网页「系统设置 → 常规」中管理。

    healthcheck:
      # 不能写死 http://：开启 HTTPS 后 8080 只接受 TLS，固定明文探测会
      # 每轮刷一条 TLS handshake error 并让容器一直 unhealthy。
      test: ["CMD", "/usr/local/bin/nook-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    # 首次部署允许拉取；日常更新请只 pull nook。
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: nook
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: nook
      TZ: Asia/Shanghai
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nook -d nook"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    pull_policy: missing
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
