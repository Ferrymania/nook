name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: 'Exact commit to test; defaults to the triggering commit'
        required: false
        type: string
    outputs:
      frontend-artifact-id:
        description: 'Tested SPA artifact from this workflow run'
        value: ${{ jobs.frontend.outputs.artifact-id }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    needs: [frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: nook-test
          POSTGRES_DB: nook_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d nook_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NOOK_TEST_POSTGRES_DSN: postgres://postgres:nook-test@localhost:5432/nook_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      # Embed the exact SPA already built and tested by the frontend job.
      - name: Download tested SPA
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.frontend.outputs.artifact-id }}
          path: web/dist

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Initialize test database
        run: docker exec ${{ job.services.postgres.id }} psql -U postgres -d nook_test -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA public'

      - name: go test
        run: go test ./...

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.web-dist.outputs.artifact-id }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org/

      - name: Type-check & build
        run: npm run build

      - name: Frontend regression tests
        run: |
          frontend_test_dir=$(mktemp -d)
          trap 'rm -rf "$frontend_test_dir"' EXIT
          npx tsc src/utils/artworkSources.test.ts src/utils/segmentQueryBatch.test.ts src/utils/homeCarousel.test.ts src/utils/mediaStatistics.test.ts src/utils/subtitleDisplay.test.ts --module commonjs --target ES2020 --strict --skipLibCheck --outDir "$frontend_test_dir"
          node "$frontend_test_dir/utils/artworkSources.test.js"
          node "$frontend_test_dir/utils/segmentQueryBatch.test.js"
          node "$frontend_test_dir/utils/homeCarousel.test.js"
          node "$frontend_test_dir/utils/mediaStatistics.test.js"
          node "$frontend_test_dir/utils/subtitleDisplay.test.js"
          npx tsc src/utils/seriesNavigation.test.ts --module commonjs --target ES2020 --strict --skipLibCheck --outDir "$frontend_test_dir"
          node "$frontend_test_dir/utils/seriesNavigation.test.js"
          node src/pages/adminLibraryPanelModel.test.ts
          npx tsc src/utils/mediaTechnicalSummary.test.ts --module commonjs --target ES2020 --strict --skipLibCheck --outDir "$frontend_test_dir"
          node "$frontend_test_dir/utils/mediaTechnicalSummary.test.js"

      - name: Upload tested SPA
        id: web-dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: Deployment smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Validate PostgreSQL compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate existing PostgreSQL compose
        run: docker compose -f docker-compose.external-postgres.yml config --quiet
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend, frontend, smoke]
    if: success()
    steps:
      - run: echo "CI passed, ready for release"
