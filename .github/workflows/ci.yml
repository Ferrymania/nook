name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: 'Exact commit to test; defaults to the triggering commit'
        required: false
        type: string

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: nook-test
          POSTGRES_DB: nook_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d nook_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NOOK_TEST_POSTGRES_DSN: postgres://postgres:nook-test@localhost:5432/nook_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # The binary embeds the SPA (web/dist) via go:embed, so the dist must exist
      # before the Go toolchain touches the `web` package.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Build SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Initialize test database
        run: docker exec ${{ job.services.postgres.id }} psql -U postgres -d nook_test -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA public'

      - name: go test
        run: go test ./...

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Artwork source regression tests
        run: |
          artwork_test_dir=$(mktemp -d)
          trap 'rm -rf "$artwork_test_dir"' EXIT
          npx tsc src/utils/artworkSources.test.ts --module commonjs --target ES2020 --skipLibCheck --outDir "$artwork_test_dir"
          node "$artwork_test_dir/utils/artworkSources.test.js"

  smoke:
    name: Deployment smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Validate PostgreSQL compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate existing PostgreSQL compose
        run: docker compose -f docker-compose.external-postgres.yml config --quiet
      - name: Validate PostgreSQL + Redis compose
        run: docker compose -f docker-compose.standard.yml config --quiet
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend, frontend, smoke]
    if: success()
    steps:
      - run: echo "CI passed, ready for release"
