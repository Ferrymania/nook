name: Beta Build

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  resolve-version:
    needs: [verify]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      binary_version: ${{ steps.version.outputs.binary_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # Beta reads the main release version without incrementing it.
      - name: Resolve beta version
        id: version
        run: |
          git fetch origin version
          BASE_VERSION=$(git show origin/version:VERSION)
          SHA_SHORT=${GITHUB_SHA:0:7}
          echo "version=${BASE_VERSION}-beta.${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "binary_version=nook-v${BASE_VERSION}-beta.${SHA_SHORT}" >> "$GITHUB_OUTPUT"

  docker-beta:
    name: Build & push beta Docker image
    needs: [verify, resolve-version]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Download tested SPA
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.verify.outputs.frontend-artifact-id }}
          path: ${{ runner.temp }}/nook-frontend/app/web/dist
      - name: Validate tested SPA
        run: test -s "$RUNNER_TEMP/nook-frontend/app/web/dist/index.html"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=beta
            type=raw,value=${{ needs.resolve-version.outputs.version }}
      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: |
            frontend=${{ runner.temp }}/nook-frontend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.resolve-version.outputs.binary_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
