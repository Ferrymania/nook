name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to publish, for example fixes-20261014'
        required: true
        type: string
      ref:
        description: 'Git ref to build from'
        required: false
        default: main
        type: string

permissions:
  contents: read
  packages: write

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve immutable commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    name: CI
    needs: [resolve-ref]
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve-ref.outputs.sha }}

  docker:
    needs: [resolve-ref, verify]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Download tested SPA
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.verify.outputs.frontend-artifact-id }}
          path: ${{ runner.temp }}/nook-frontend/app/web/dist
      - name: Validate tested SPA
        run: test -s "$RUNNER_TEMP/nook-frontend/app/web/dist/index.html"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.ref == 'main' }}
            type=raw,value=${{ env.RELEASE_VERSION }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: |
            frontend=${{ runner.temp }}/nook-frontend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
